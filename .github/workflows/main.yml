name: CI/CD

on:
  push:
    branches:
      - '*'
      - '!*/**'

jobs:
  workflow:
    runs-on: ubuntu-latest

    on:
      push:
        branches:
          - main
      pull_request:
        branches:
          - main

    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup
        run: yarn install --immutable

      - name: Prettier
        run: yarn prettier:check

      - name: ESLint
        run: yarn lint

      - name: Unit Tests
        run: yarn test:coverage
